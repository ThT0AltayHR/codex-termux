# GitHub Actions builds the Android ARM64 payload and publishes a public,
# rolling GitHub Release asset. Termux users download that verified asset and
# do not need Rust, the Android NDK, or a local source compilation.
name: termux-npm-build-publish

on:
  push:
    branches:
      - main
      - lts
  workflow_dispatch:

jobs:
  build-android-arm64:
    name: Build Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      ANDROID_NDK_VERSION: "28.2.13676358"
      # Keep the release tarball under the
      # registry's unpacked-size limit (~512 MiB). Default release profile
      # produced ~520 MiB and was rejected with HTTP 413 Payload Too Large.
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_PANIC: "abort"
      CARGO_PROFILE_RELEASE_STRIP: "symbols"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify checked-out revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev protobuf-compiler

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --target aarch64-linux-android

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME must be set on the GitHub runner}"
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/cmdline-tools/bin:${PATH}"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${ANDROID_NDK_VERSION}"
          ndk_home="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ndk_home}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ndk_home}" >> "${GITHUB_ENV}"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_NDK_HOME:?ANDROID_NDK_HOME must point to Android NDK r27c or newer}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          export LIBLZMA_NO_PKG_CONFIG=1
          export PATH="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin:${PATH}"
          eval "$(python3 scripts/fetch_rusty_v8_android.py | grep '^export ' | sed 's/^export //')"
          export RUSTY_V8_ARCHIVE RUSTY_V8_SRC_BINDING_PATH
          export CC_aarch64_linux_android="aarch64-linux-android29-clang"
          export CXX_aarch64_linux_android="aarch64-linux-android29-clang++"
          export AR_aarch64_linux_android="llvm-ar"
          export RANLIB_aarch64_linux_android="llvm-ranlib"
          export PKG_CONFIG_ALLOW_CROSS=1
          export OPENSSL_NO_PKG_CONFIG=1
          # v8 (code-mode JIT) references __clear_cache, a compiler-rt builtin.
          # With the release profile's -nodefaultlibs, the NDK does not auto-link
          # it, so link the compiler-rt builtins archive explicitly. We replicate
          # the .cargo/config.toml android rustflags here because the per-target
          # RUSTFLAGS env overrides (does not merge with) the config file.
          builtins="$(find "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64" -name 'libclang_rt.builtins-aarch64-android.a' -print -quit 2>/dev/null)"
          if [ -z "${builtins}" ]; then echo "clang_rt builtins for aarch64-android not found under NDK" >&2; exit 1; fi
          echo "linking compiler-rt builtins: ${builtins}"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-Clink-arg=-lc++_shared -Clink-arg=-Wl,-rpath,\$ORIGIN -Clink-arg=${builtins}"
          cd codex-rs
          rustup run 1.95.0 cargo build --target aarch64-linux-android --release -p codex-cli

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cp codex-rs/target/aarch64-linux-android/release/codex npm-package/bin/codex.bin
          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" npm-package/bin/libc++_shared.so
          # Strip native binaries and libc++ to stay
          # under npm's unpacked-size limit (~512 MiB). Without this the tarball is
          # rejected with HTTP 413 Payload Too Large.
          export PATH="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin:${PATH}"
          llvm-strip --strip-all npm-package/bin/codex.bin npm-package/bin/libc++_shared.so
          chmod 0755 npm-package/bin/codex npm-package/bin/codex-exec npm-package/bin/codex.bin
          chmod 0644 npm-package/bin/libc++_shared.so
          CODEX_PUBLIC_SANITIZED_TREE=1 bash verify-patches.sh
          cd npm-package
          rm -f ./*.tgz
          npm pack
          package_tgz="$(ls -1 *.tgz)"
          package_version="$(node -p "require('./package.json').version")"
          sha256sum "${package_tgz}" | tee "${package_tgz}.sha256"
          echo "PACKAGE_TGZ=npm-package/${package_tgz}" >> "${GITHUB_ENV}"
          echo "PACKAGE_SHA256_FILE=npm-package/${package_tgz}.sha256" >> "${GITHUB_ENV}"
          echo "PACKAGE_VERSION=${package_version}" >> "${GITHUB_ENV}"
          ls -lh "${package_tgz}" "${package_tgz}.sha256"

      - name: Upload npm tarball artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-cli-termux-android-arm64-${{ env.PACKAGE_VERSION }}
          path: |
            ${{ env.PACKAGE_TGZ }}
            ${{ env.PACKAGE_SHA256_FILE }}
          if-no-files-found: error

      - name: Prepare stable Termux runtime assets
        shell: bash
        run: |
          set -euo pipefail
          cp "${PACKAGE_TGZ}" codex-termux-runtime.tgz
          sha512sum codex-termux-runtime.tgz > codex-termux-runtime.tgz.sha512
          ls -lh codex-termux-runtime.tgz codex-termux-runtime.tgz.sha512

      - name: Publish rolling Termux release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: termux-latest
        shell: bash
        run: |
          set -euo pipefail
          notes=$'Automated Android ARM64 Termux runtime built from commit '"${GITHUB_SHA}"$'.\n\nThis rolling release is consumed by start.sh. The runtime is checksum-verified before extraction.'
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "Codex Termux — latest Android ARM64 runtime" \
              --notes "${notes}"
            gh release upload "${RELEASE_TAG}" \
              codex-termux-runtime.tgz \
              codex-termux-runtime.tgz.sha512 \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              codex-termux-runtime.tgz \
              codex-termux-runtime.tgz.sha512 \
              --title "Codex Termux — latest Android ARM64 runtime" \
              --notes "${notes}" \
              --prerelease
          fi
